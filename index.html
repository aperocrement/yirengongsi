<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一人公司众生相</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

  /* 方向：把不同方向、不同阶段的一人公司创业者放进一张目录，每人记下他的问题与答案；墨色与朱砂做底，荧光笔圈出答案。 */
  :root {
    --paper: #F2F0E7;
    --paper-2: #E9E6D9;
    --ink: #1C201A;
    --ink-soft: #565A4E;
    --line: #D4D0BE;
    --mark: #EAE03C;
    --red: #BE3B2B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1E18;
      --paper-2: #22261F;
      --ink: #E7E4D6;
      --ink-soft: #A9AD9F;
      --line: #3A3E33;
      --mark: #D7CC28;
      --red: #E26A55;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1E18;
    --paper-2: #22261F;
    --ink: #E7E4D6;
    --ink-soft: #A9AD9F;
    --line: #3A3E33;
    --mark: #D7CC28;
    --red: #E26A55;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }

  /* 插图 */
  svg.art { display: block; max-width: 100%; height: auto; }
  .il-paper { fill: var(--paper); }
  .il-ink { fill: var(--ink); }
  .il-red { fill: var(--red); }
  .il-mark { fill: var(--mark); }
  .il-stroke-ink { stroke: var(--ink); }
  .il-stroke-paper { stroke: var(--paper); }
  .emblem { flex: none; display: grid; place-items: center; width: 34px; height: 34px; }
  .emblem svg { width: 26px; height: 26px; display: block; }

  /* 头部 */
  .hero {
    margin-top: calc(-1 * env(safe-area-inset-top, 0px));
    padding-top: calc(env(safe-area-inset-top, 0px) + 4rem);
    padding-bottom: 3.25rem;
    background:
      linear-gradient(180deg, rgba(234,224,60,0.14), rgba(234,224,60,0) 46%),
      var(--paper);
  }
  .seal {
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    background: var(--red);
    color: var(--paper);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1;
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    margin-bottom: 1.6rem;
  }
  .hero-kicker {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0 0 1.2rem;
  }
  .hero h1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: clamp(2rem, 6.5vw, 3.6rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 1.4rem;
    text-wrap: balance;
  }
  .hero .thesis {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: clamp(1.15rem, 3.4vw, 1.5rem);
    line-height: 1.5;
    margin: 0 0 1.1rem;
    max-width: 32em;
  }
  .hero .thesis mark {
    background: var(--mark);
    color: var(--ink);
    padding: 0.02em 0.3em;
    border-radius: 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .hero .lede {
    font-size: 0.98rem;
    color: var(--ink-soft);
    max-width: 34em;
    margin: 0;
  }

  /* 章节 */
  section { padding: 3rem 0; }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.6rem;
  }
  .sec-head h2 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  .sec-head .desc {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin-left: auto;
    white-space: nowrap;
  }
  .sec-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.12em 0.65em;
    flex: none;
  }

  /* 人物目录 */
  .people {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .person {
    background: var(--paper);
    padding: 1.25rem 1.35rem;
    min-width: 0;
  }
  .p-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 0.1rem;
  }
  .p-name {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 1.14rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .stage {
    flex: none;
    font-size: 0.72rem;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.08em 0.6em;
    white-space: nowrap;
  }
  .p-dir {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin: 0 0 0.95rem;
  }
  .p-body {
    margin: 0;
    display: grid;
    gap: 0.5rem;
  }
  .p-row {
    display: flex;
    gap: 0.55rem;
    align-items: baseline;
  }
  .p-row dt {
    flex: none;
    min-width: 4.4em;
    color: var(--red);
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .p-row dd {
    margin: 0;
    font-size: 0.93rem;
    color: var(--ink-soft);
    min-width: 0;
  }
  .p-row dd b { color: var(--ink); font-weight: 600; }
  .p-row dd mark {
    background: var(--mark);
    color: var(--ink);
    padding: 0.02em 0.22em;
    border-radius: 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  footer {
    padding: 2.5rem 0 4rem;
    border-top: 1px solid var(--line);
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  footer p { margin: 0; max-width: 38em; }

  @media (max-width: 680px) {
    .hero { padding-top: calc(env(safe-area-inset-top, 0px) + 2.75rem); }
    .people { grid-template-columns: 1fr; }
    .sec-head { flex-wrap: wrap; }
    .sec-head .desc { margin-left: 0; width: 100%; }
  }


  #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate-box { width: 100%; max-width: 360px; text-align: center; }
  .gate-box .seal { margin: 0 auto 1.5rem; }
  .gate-box h1 { font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 1.55rem; line-height: 1.25; margin: 0 0 0.6rem; }
  .gate-box .hint { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 1.7rem; }
  .gate-box form { display: grid; gap: 0.7rem; }
  .gate-box input { width: 100%; padding: 0.85rem 1rem; font-size: 1.1rem; font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); text-align: center; letter-spacing: 0.35em; }
  .gate-box input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  .gate-box button { padding: 0.85rem 1rem; font-size: 1rem; font-family: inherit; border: 0; border-radius: 4px; background: var(--ink); color: var(--paper); cursor: pointer; font-weight: 600; }
  .gate-box button:hover { background: var(--red); }
  .gate-box .err { color: var(--red); font-size: 0.85rem; margin: 0.8rem 0 0; }

</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <div class="seal">众</div>
    <h1>一人公司 · 众生相</h1>
    <p class="hint">内容已加密，输入密码查看。</p>
    <form id="pwform" autocomplete="off">
      <input type="password" id="pw" inputmode="numeric" placeholder="密码" aria-label="密码">
      <button type="submit">解锁</button>
    </form>
    <p class="err" id="err" hidden>密码不对，再试一次。</p>
  </div>
</div>
<div id="content" hidden></div>
